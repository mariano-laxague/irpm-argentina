name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependency graph
        run: python -m pip check
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Generate dashboard with fixture data
        shell: pwsh
        run: |
          python tests/prepare_dashboard_fixture.py --db .ci/dashboard.db
          $env:IRPM_DB_PATH = '.ci/dashboard.db'
          $env:IRPM_DASHBOARD_OUTPUT = '.ci/dashboard.html'
          $env:IRPM_DASHBOARD_DOCS_OUTPUT = '.ci/dashboard-docs.html'
          $env:IRPM_DASHBOARD_MANIFEST_OUTPUT = '.ci/deploy_manifest.json'
          python src/dashboard/generate_dashboard.py
          if (!(Test-Path .ci/dashboard.html) -or ((Get-Item .ci/dashboard.html).Length -eq 0)) {
            throw 'El dashboard no se generó.'
          }
          if (!(Test-Path .ci/deploy_manifest.json)) {
            throw 'El manifest de deploy no se generó.'
          }
